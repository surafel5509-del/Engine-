# Temporary bootstrap: caches a local build toolchain (JRE, kotlinc, android.jar,
# junit, hamcrest, org.json, rhino) onto the `toolchain-cache` branch so engine
# work can be compile-verified and headless-tested in restricted sandboxes.
# Only re-runs when this file itself changes. Safe to delete alongside the branch.
name: Toolchain cache

on:
  push:
    paths: ['.github/workflows/toolchain.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gather toolchain
        run: |
          mkdir -p out src
          set -x
          {
          # Kotlin compiler (runners can reach release assets)
          curl -sL --retry 3 -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d out
          # Android platform jar (compile-time API surface)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          cp "$ANDROID_HOME/platforms/android-34/android.jar" out/android-34.jar
          # Compact JRE for running kotlinc/tests in a JDK-less sandbox
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.logging,java.management,java.naming,java.xml,java.desktop,jdk.unsupported,jdk.zipfs,jdk.crypto.ec \
            --strip-debug --no-man-pages --no-header-files --compress=2 --output out/jre
          # org.json (test runtime; shadows the android stub)
          curl -sL --retry 3 -o json.tgz https://codeload.github.com/stleary/JSON-java/tar.gz/refs/tags/20231013
          mkdir -p src/json && tar xzf json.tgz -C src/json --strip-components=1
          JSONF=$(find src/json -name '*.java' -path '*org/json*')
          echo "json files: $(echo "$JSONF" | wc -l)"
          "$JAVA_HOME/bin/javac" -nowarn -d src/json-classes $JSONF
          "$JAVA_HOME/bin/jar" cf out/org-json-20231013.jar -C src/json-classes org
          # Rhino (JavaScript runtime)
          curl -sL --retry 3 -o out/rhino-1.7.13.jar https://github.com/mozilla/rhino/releases/download/Rhino1_7_13_Release/rhino-1.7.13.jar
          } 2>&1 | tee gather.log || true
          ls -la out | tee -a gather.log || true
          du -sh out/* | sort -h | tee -a gather.log || true

      - name: Commit toolchain branch
        if: always()
        run: |
          cp gather.log out/gather.log 2>/dev/null || echo "no gather.log" > out/gather.log
          BR="toolchain-cache-${GITHUB_RUN_NUMBER}"
          cd out
          git init -q -b "$BR"
          git config user.email "arena@localhost"
          git config user.name "toolchain-bot"
          git add -A
          git commit -qm "toolchain cache $BR $(date -u +%FT%TZ)"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BR"
          echo "branch=$BR" 
        env:
          GITHUB_TOKEN: ${{ github.token }}
