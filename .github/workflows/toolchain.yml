# Temporary bootstrap: caches a local build toolchain (JRE, kotlinc, android.jar,
# mockable android.jar, junit, rhino) onto the `toolchain-cache` branch so engine
# work can be compile-verified and headless-tested in restricted sandboxes.
# Only re-runs when this file itself changes. Safe to delete alongside the branch.
name: Toolchain cache

on:
  push:
    paths: ['.github/workflows/toolchain.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gather toolchain
        run: |
          mkdir -p out
          # Kotlin compiler (runners can reach release assets)
          curl -sL --retry 3 -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip -d out
          # Android platform jar + AGP mockable jar (methods return defaults) for headless unit tests
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          cp "$ANDROID_HOME/platforms/android-34/android.jar" out/android-34.jar
          # JRE for running kotlinc/tests in a JDK-less sandbox
          "$JAVA_HOME/bin/jlink" --add-modules java.base,java.logging,java.management,java.naming,jdk.unsupported,jdk.zipfs,jdk.crypto.ec \
            --strip-debug --no-man-pages --no-header-files --compress=2 --output out/jre
          # Libraries
          curl -sL --retry 3 -o out/rhino-1.7.13.jar https://github.com/mozilla/rhino/releases/download/Rhino1_7_13_Release/rhino-1.7.13.jar
          curl -sL --retry 3 -o out/junit-4.13.2.jar https://github.com/junit-team/junit4/releases/download/r4.13.2/junit-4.13.2.jar
          curl -sL --retry 3 -o out/hamcrest-core-1.3.jar https://github.com/hamcrest/JavaHamcrest/releases/download/hamcrest-java-1.3/hamcrest-core-1.3.jar
          du -sh out/*

      - name: Try mockable android jar (needs gradle; optional)
        run: |
          chmod +x gradlew || true
          ./gradlew --no-daemon :app:createMockableJar > mockable.log 2>&1 || true
          find app/build -name "mockable*.jar" -exec cp {} out/ \; || true
          ls out/ | grep mockable || echo "no mockable jar (will use android-34.jar)"

      - name: Commit to toolchain-cache
        run: |
          cd out
          git init -q -b toolchain-cache
          git config user.email "arena@localhost"
          git config user.name "toolchain-bot"
          git add -A
          git commit -qm "toolchain cache $(date -u +%FT%TZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" toolchain-cache
        env:
          GITHUB_TOKEN: ${{ github.token }}
