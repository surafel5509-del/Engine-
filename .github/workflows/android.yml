name: Build S Engine APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Native C++ engine tests (host build of the script VM + landscape)
        run: |
          cd app/src/main/cpp
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-unused-parameter tests/script_tests.cpp script/*.cpp engine/*.cpp -o /tmp/script_tests
          out=$(/tmp/script_tests 2>&1) && code=0 || code=$?
          echo "::notice title=Native tests::$(echo "$out" | tail -12 | sed ':a;N;$!ba;s/\n/%0A/g')"
          [ $code -eq 0 ] || exit $code
          # host JNI build so the JVM unit tests exercise the real native engine
          g++ -std=c++17 -O2 -shared -fPIC -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" script/*.cpp engine/*.cpp jni/*.cpp -o /tmp/libsengine.so
          echo "SENGINE_NATIVE_LIB=/tmp/libsengine.so" >> "$GITHUB_ENV"
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          [ -n "$ndk" ] && echo "SENGINE_NDK_VERSION=$(basename "$ndk")" >> "$GITHUB_ENV"
          echo "::notice title=NDK::$(basename "$ndk")"

      - name: Unit tests (headless engine simulation)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log; code=${PIPESTATUS[0]}
          msg=$( (grep -E "^e: |FAILED|Exception|expected|AssertionError|at com.sengine" test.log | head -40; grep -E "SIM (native|cpp|landscape|v5|v6)" test.log | head -30; grep "SIM " test.log | head -20) | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Engine tests::${msg}"
          exit $code

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log || {
            # surface compiler errors as annotations
            msg=$(grep -E "^e: |error:|What went wrong|Could not|FAILURE" build.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build errors::${msg}"
            exit 1
          }

      - name: Check native libraries are packaged
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libsengine.so | tee libs.txt
          for abi in arm64-v8a armeabi-v7a x86_64; do grep -q "lib/$abi/libsengine.so" libs.txt || { echo "::error title=NDK::missing lib/$abi/libsengine.so"; exit 1; }; done
          echo "::notice title=Native libs::$(sed ':a;N;$!ba;s/\n/%0A/g' libs.txt)"

      - name: Game export test (build a standalone game APK with S Engine's builder)
        run: |
          set -o pipefail
          keytool -genkeypair -keystore export-test.p12 -storetype PKCS12 -storepass sengine -keypass sengine \
            -alias game -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=S Engine Export Test" -noprompt
          export SENGINE_SOURCE_APK=$PWD/app/build/outputs/apk/debug/app-debug.apk
          export SENGINE_KEYSTORE=$PWD/export-test.p12
          export SENGINE_EXPORT_OUT=$PWD/SpaceRun-game.apk
          ./gradlew --no-daemon testDebugUnitTest --tests com.sengine.ApkExportTest --rerun 2>&1 | tee export.log || {
            msg=$(grep -E "SIM |FAILED|Exception|expected|AssertionError|at com.sengine" export.log | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Export test::${msg}"; exit 1; }
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          out=$("$BT/apksigner" verify --verbose --print-certs SpaceRun-game.apk 2>&1) || { echo "::error title=apksigner::$(echo "$out" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          badge=$("$BT/aapt2" dump badging SpaceRun-game.apk 2>&1 | grep -E "^package:|application-label:|launchable-activity" | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Exported game APK::$(echo "$out" | head -8 | sed ':a;N;$!ba;s/\n/%0A/g')%0A${badge}%0A$(grep 'SIM export' export.log | head -3)"
          echo "$badge" | grep -q "name='com.sengine.game.spacerun'" || { echo "::error title=Export::package not renamed"; exit 1; }
          echo "$badge" | grep -q "versionName='1.2.3'" || { echo "::error title=Export::versionName not patched"; exit 1; }

      - name: Upload exported sample game
        uses: actions/upload-artifact@v4
        with:
          name: SpaceRun-exported-game-apk
          path: SpaceRun-game.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish rolling "latest build" pre-release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SEngine.apk
          gh release delete sengine-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create sengine-latest SEngine.apk \
            --target "${GITHUB_SHA}" --prerelease \
            --title "S Engine – latest build" \
            --notes "Automatic debug build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install SEngine.apk on Android 8.0+."
        env:
          GH_TOKEN: ${{ github.token }}
