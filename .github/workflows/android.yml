name: Build S Engine APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (headless engine simulation)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log; code=${PIPESTATUS[0]}
          grep -E "SIM |FAILED|Exception|expected|AssertionError" test.log | head -60 | while IFS= read -r line; do
            echo "::notice::${line}"
          done
          exit $code

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log || {
            # surface compiler errors as annotations
            grep -E "^e: |error:|What went wrong|Could not|FAILURE" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SEngine-debug-apk
          path: app/build/outputs/apk/debug/*.apk
